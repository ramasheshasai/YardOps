version: "3.9"

services:

  app:
    build: .
    container_name: yardops_app
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yardops
      REDIS_URL: redis://redis:6379/0

  postgres:
    image: postgres:15
    container_name: yardops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yardops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   

  redis:
    image: redis:7
    container_name: yardops_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:   