apiVersion: apps/v1
kind: Deployment
metadata:
  name: yardops-app
  namespace: yardops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yardops-app
  template:
    metadata:
      labels:
        app: yardops-app
    spec:
      containers:
        - name: yardops-app
          image: yardops-app:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: yardops-config
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: yardops-config
                  key: REDIS_URL

---
apiVersion: v1
kind: Service
metadata:
  name: yardops-service
  namespace: yardops
spec:
  type: NodePort
  selector:
    app: yardops-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007